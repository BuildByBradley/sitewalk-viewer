<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SiteWalk Compare</title>
  <script type="module" crossorigin src="./assets/viewer-8nb2IbHy.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/viewer-BiTA6uJB.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <a href="./" class="home" title="All projects">← Projects</a>
      <h1>SiteWalk Compare</h1>
      <select id="project" title="Project"></select>
      <select id="week" title="Week"></select>
      <label title="When switching weeks, jump to the frame taken from the same spot"><input type="checkbox" id="samespot" checked /> same spot</label>
      <span id="verdict" class="badge">-</span>
      <span class="spacer"></span>
      <span id="who" class="muted small" hidden></span>
      <button id="signout" data-signout hidden title="Sign out of SiteWalk on this device">Sign out</button>
      <a id="alignlink" href="#">Align this week</a>
    </header>

    <main class="panes" id="panes">
      <div class="pane" id="pane-video">
        <div class="label">1 · Site video</div>
        <div class="tools"><button data-max="pane-video" title="Maximise">⤢</button></div>
        <video id="video" playsinline muted preload="auto" crossorigin="anonymous"></video>
      </div>
      <div class="pane" id="pane-model">
        <div class="label">2 · Revit walkthrough</div>
        <div class="tools">
          <button id="freelook" title="Orbit freely; click again to follow the walk">Free look</button>
          <button data-max="pane-model" title="Maximise">⤢</button>
        </div>
        <div class="lost">Tracking lost</div>
      </div>
      <div class="pane overlay" id="pane-overlay">
        <div class="label">3 · Overlay: Revit over site</div>
        <div class="tools"><button data-max="pane-overlay" title="Maximise">⤢</button></div>
        <div class="lost">Tracking lost: no overlay for this part of the walk</div>
      </div>
    </main>

    <footer class="controls">
      <div class="group">
        <button id="play" class="primary" title="Play / pause (space)">▶</button>
        <button id="back" title="Previous frame (,)">⏮</button>
        <button id="fwd" title="Next frame (.)">⏭</button>
      </div>
      <input id="scrub" class="scrub" type="range" min="0" max="1000" step="1" value="0" />
      <span id="time" class="time">0:00.0 / 0:00.0</span>
      <select id="speed" title="Speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
      </select>
      <div class="group">
        <select id="mode" title="Overlay style">
          <option value="edges" selected>Edges</option>
          <option value="ghost">Ghost</option>
          <option value="wire">Wireframe</option>
          <option value="category">Colour by category</option>
        </select>
        <label class="muted" title="Overlay opacity">opacity <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.85" /></label>
        <details class="cats"><summary>Categories</summary><div class="menu" id="cats"></div></details>
      </div>
    </footer>
  </div>
</body>
</html>
